<!DOCTYPE html>
<html lang="en" dir="ltr" data-look="white">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floor Plan Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        var d = document.documentElement;
        var v = null;
        var l = null;
        try {
          v = localStorage.getItem('fpb-look');
          l = localStorage.getItem('fpb-lang');
        } catch (e) {}
        d.setAttribute('data-look', v === 'black' || v === 'white' ? v : 'white');
        var h = location.hash;
        if (h === '#ar' || h === '#en') l = h.slice(1);
        if (l === 'ar') {
          d.lang = 'ar';
          d.dir = 'rtl';
        } else {
          d.lang = 'en';
          d.dir = 'ltr';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
